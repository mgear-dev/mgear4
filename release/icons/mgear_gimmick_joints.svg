<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bent joint chain: upper bone, elbow joint, lower bone -->
    <circle cx="4" cy="15" r="2"></circle>
    <line x1="6" y1="15" x2="10" y2="15"></line>
    <circle cx="12" cy="15" r="2"></circle>
    <line x1="12.7" y1="13.1" x2="15.3" y2="5.9"></line>
    <circle cx="16" cy="4" r="2"></circle>
    <!-- Blended joint halfway between both bones (colored), with a support -->
    <g stroke="#7cb5a0">
        <line x1="13.7" y1="13.8" x2="18.6" y2="10.4"></line>
        <circle cx="20" cy="9.4" r="1.6"></circle>
        <line x1="20" y1="11" x2="20" y2="14"></line>
    </g>
</svg>
